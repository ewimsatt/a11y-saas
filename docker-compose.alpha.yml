# Local single-user alpha only. Run with an uncommitted --env-file generated by
# `pnpm alpha:env`; this file deliberately has no defaults for secrets or tokens.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generate alpha env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate alpha env first}
      POSTGRES_DB: a11y
    volumes: [alpha-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [app_internal]

  redis:
    image: redis:7
    networks: [app_internal]

  migrate:
    build:
      context: .
      dockerfile: infra/alpha/Dockerfile
    command: ["pnpm", "exec", "prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?generate alpha env first}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_internal]

  api:
    build:
      context: .
      dockerfile: infra/alpha/Dockerfile
    command: ["pnpm", "--filter", "@a11y/api", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?generate alpha env first}
      REDIS_URL: redis://redis:6379
      # Required only inside this isolated Compose network. The sole host
      # publication remains loopback at 127.0.0.1 below.
      HOST: 0.0.0.0
      CONTAINER_BIND_ALL_INTERFACES: "1"
      CORS_ORIGIN: http://127.0.0.1:3010,http://localhost:3010
    depends_on: [postgres, redis]
    ports: ["127.0.0.1:3001:3001"]
    networks: [app_internal]

  worker:
    build:
      context: .
      dockerfile: infra/alpha/Dockerfile
    command: ["pnpm", "--filter", "@a11y/worker", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?generate alpha env first}
      REDIS_URL: redis://redis:6379
      PLAYWRIGHT_WS_ENDPOINT: ws://browser:3000/${PLAYWRIGHT_WS_TOKEN:?generate alpha env first}
      EVIDENCE_DIR: /app/evidence
    depends_on: [postgres, redis, browser]
    volumes: [alpha-evidence:/app/evidence]
    networks: [app_internal, browser_control]

  browser:
    build: { context: ./infra/playwright }
    environment:
      PLAYWRIGHT_WS_TOKEN: ${PLAYWRIGHT_WS_TOKEN:?generate alpha env first}
      SCANNER_PROXY_URL: http://smokescreen:4750
    read_only: true
    tmpfs: ["/tmp", "/home/pwuser"]
    security_opt: ["no-new-privileges:true", "seccomp:./infra/playwright/seccomp_profile.json"]
    cap_drop: ["ALL"]
    cap_add: ["SYS_CHROOT"]
    pids_limit: 512
    mem_limit: 1g
    cpus: 2.0
    networks: [browser_control]

  smokescreen:
    build: { context: ./infra/scanner-egress }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    networks: [browser_control, scanner_egress]

networks:
  app_internal: { internal: true }
  browser_control: { internal: true }
  scanner_egress: {}

volumes:
  alpha-pgdata: {}
  alpha-evidence: {}
