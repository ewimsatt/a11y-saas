name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: a11y_stage_dispatch_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a11y_stage_dispatch_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install matching Playwright Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate stage-dispatch test database
        env:
          DATABASE_URL: postgresql://postgres:synthetic_only@127.0.0.1:5432/a11y_stage_dispatch_test_ci
        run: pnpm exec prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://postgres:synthetic_only@127.0.0.1:5432/a11y_stage_dispatch_test_ci
          STAGE_DISPATCH_TEST_DATABASE_URL: postgresql://postgres:synthetic_only@127.0.0.1:5432/a11y_stage_dispatch_test_ci
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test
      - name: Web build
        run: pnpm --filter @a11y/web build
      - name: Full-stack owned-fixture acceptance
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: pnpm test:acceptance
      - name: Scanner egress boundary acceptance
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: pnpm test:scanner-egress
      - name: Rendered console regressions
        run: pnpm test:ui
