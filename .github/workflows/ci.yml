name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install matching Playwright Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Web build
        run: pnpm --filter @a11y/web build
      - name: Full-stack owned-fixture acceptance
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: pnpm test:acceptance
      - name: Rendered console regressions
        run: pnpm test:ui
